    let city = 'Kochi'
    const inputForm = document.getElementById("inputForm")
    inputForm.addEventListener("submit", e=> {
        e.preventDefault()
        const inputBox = document.getElementById("inputBox")
        city = inputBox.value
        getCords(inputBox.value)
    })

    async function getCords(value){
        const response = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${value}&limit=10&appid=9c263955375895dac365d25cbadce57d`)
        if(response.status == 200){
            response.json().then(data => {
                console.log(data);
                console.log(data[0].lat);
                console.log(data[0].lon);     
                getWeather(data[0].lat,data[0].lon,data[0].name,data[0].state,data[0].country)          
            })
        }
    }

    async function getWeather(lat,lon,name,state,country){
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=9c263955375895dac365d25cbadce57d`)
        response.json().then(data => {
            console.log(data);
            let descLength = data.weather[0].description.length
            const outputArea = document.getElementById("outputArea")
            
            outputArea.innerHTML = `
            <h3 class="text-center text-white">${name}, ${state}, ${country} </h3>
            <img class="mx-auto" src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" alt="weather sprite">
            <h3 class="text-center text-white text-xl font-bold">${data.weather[0].description[0].toUpperCase()}${data.weather[0].description.slice(1,descLength)}</h3>
            <h3 class="text-center text-white">Feels like ${Math.floor(data.main.feels_like - 273)}°C </h3>
            <h3 class="text-center text-white">${Math.floor(data.main.temp_min - 273)}°C  min ${Math.floor(data.main.temp_max - 273)}°C max</h3>
            

            <h3 class="text-center text-white">${data.wind.speed} m/s</h3>`
        })
    }

    setInterval(() => {
        let dateTime = new Date()
        time = dateTime.toLocaleTimeString()
        date = dateTime.toLocaleDateString()
        console.log(time,date,dateTime);
        let displayTime = document.getElementById("displayTime")
        displayTime.innerText = `${date} ${time}`
    },1000)

    window.addEventListener("load",() => {
        getCords(city)
    })
